# DK（PCA10056）没有原厂 USB bootloader，应用从 0x0 直接链接运行。
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_USE_DT_CODE_PARTITION=n

# 通过 HWINFO 提供稳定的设备标识。
CONFIG_HWINFO=y

# BTP 二进制传输走 UART0（板载 J-Link VCOM），uart-pipe 是唯一生产传输。
CONFIG_UART_PIPE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
# 保持 BTP 为唯一生产传输；日志使用单独的诊断构建。
CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_LOG=n

# 该控制器不提供可选的 subrating 能力。
CONFIG_BT_SUBRATING=n
